# config/full_experiment.yaml
# Base configuration template for *real* experiments.  Dataset-/model-specific
# placeholders must be filled in the next step.

data:
  name: synthetic                          # Use synthetic dataset for full experiment
  n_samples: 10000                         # Total number of samples
  n_features: 10                           # Dimensionality
  max_budget: 20                           # Maximum fidelity/budget
  train_split: 0.8

model:
  hidden_dim: 128
  output_noise: 0.01

train:
  epochs: 100
  lr: 0.01

# Monotonicity regulariser strength (λ in the paper)
monotonicity_lambda: 0.1

misc:
  seed: 0
  experiment_name: full_experiment

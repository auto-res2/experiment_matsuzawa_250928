# config/smoke_test.yaml
# Minimal configuration used by the CI smoke test.  Runs for 5 epochs on a
# tiny synthetic data set to validate that the full stack executes without
# errors.

data:
  name: synthetic          # use built-in generator
  n_samples: 120
  n_features: 5
  max_budget: 20
  train_split: 0.8

model:
  hidden_dim: 32           # width of MLP in deep kernel
  output_noise: 0.01       # GaussianLikelihood noise prior (unused in core)

train:
  epochs: 5
  lr: 0.05

monotonicity_lambda: 0.1

misc:
  seed: 0
  experiment_name: smoke_test
